<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<script type="text/javascript" src="json/true_false_quest.json"></script>
	<script type="text/javascript" src="json/mult_ans_quest.json"></script>
	<script type="text/javascript" src="js/quiz.js"></script>
	<title>Ultimate Gameshow</title>
	<style type="text/css">
		:root{
			--lilac : #71639C;
			--answer : #FFFFFF;
		}

		body{
			font-family: "Times New Roman", Times, serif;
			background-color: #EEDBE4;
		}
		h1{
			text-align:center;
			font-size: 40px;
		}
		h3{
			text-align:left;
			font-size: 24px;
		}
		.menu{
			background-color: white;
			text-align:center;
			border: 2px solid var(--lilac);
			font-size: 24px;
			padding: 10px 30px;
			border-radius: 4px;
			color: black;
			transition-duration: 0.4s;
			display: block;
			margin-left: auto;
			margin-right: auto;
		}
		.menu:hover{
			background-color: #71639C;
			color: white;
		}
		.game_window{
			width: 80%;
			margin-left: auto;
			margin-right: auto;
			font-size: 24px;
			background-color: white;
			
		}
		table,tr,th,td{
			border: 2px solid black;
			border-spacing: 15px 5px;
			text-align: center;
			background-color: white;
		}
		td{
			font-size: 16px;
			padding: 20px 20px;
		}
		.answer{
			width: 33%;
			transition-duration: 0.4s;

		}
		.answer:hover{
			background-color: #71639C !important;
			color: white;
			cursor: pointer;
		}
	</style>
</head>
<body>
	
	<h1>Ultimate Gameshow</h1><br><br><br>
	<h3 id="total" style="display: none;">Total Questions: 0</h3>
	<br><br>
	<h3 id="correct" style="display: none;">Correct Answers: 0</h3>
	<br><br>
	
	<button class="menu" id="play_button" onclick="start_game()">PLAY!</button>
	<button class="menu" id="selection1" style="display: none;" onclick="mult_game()">Multiple Choice</button><br>
	<button class="menu" id="selection2" style="display: none;" onclick="binary_game()">True Or False</button>
	<br><br>
	<table class="game_window" id="game_window" style="display: none">
		<tr>
			<th id="number" colspan="3">Question</th>
		</tr>
		<tr>
			<td id="question_text" colspan="3"></td>
		</tr>
		<tr>
			<td class="answer" id="answer1" onclick="select_answer(1)"></td>
			<td class="answer" id="answer2" onclick="select_answer(2)"></td>
			<td class="answer" id="answer3" onclick="select_answer(3)"></td>
		</tr>
	</table>
	<table class="game_window" id="game_window2" style="display: none">
		<tr>
			<th id="number2" colspan="3">Question</th>
		</tr>
		<tr>
			<td id="question_text2" colspan="3"></td>
		</tr>
		<tr>
			<td class="answer" id="ans1" onclick="binary_answer(1)">True</td>
			<td class="answer" id="ans0" onclick="binary_answer(0)">False</td>
		</tr>
	</table>
</body>
</html>
